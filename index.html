<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SHARK">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Cronômetro Shark Muay Thai</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0b0b;--prep:#c8d12e;--work:#3d8fcb;--rest:#d9534f;--done:#2e9e5b;--fg:#f2f2f2;--mut:#8d8d8d;--card:#171717;--line:#2a2a2a;
--cur:#c8d12e;--on-cur:#141414;--nxt:#3d8fcb;--on-nxt:#fff;--accent:#c8d12e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);overflow:hidden;
font-family:'Bebas Neue','Oswald','Barlow Condensed','Roboto Condensed','Arial Narrow',Impact,sans-serif;letter-spacing:.03em;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;cursor:pointer}
#app{height:100dvh;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
.view{flex:1;min-height:0;display:none;flex-direction:column}
.view.on{display:flex}
.top{display:flex;align-items:center;gap:10px;padding:8px 12px;min-height:58px}
.brand{display:flex;align-items:center;gap:8px;min-width:0;flex:1}
.brand img{width:36px;height:36px;border-radius:50%;object-fit:cover;flex:none}
.brand span{font-size:21px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mid{text-align:center;line-height:1;flex:none;color:var(--accent)}
.mid small{font-size:16px;display:block}
.mid b{display:block;font-size:34px;font-weight:400}
.icons{flex:1;display:flex;justify-content:flex-end;gap:8px}
.ib{width:42px;height:42px;border-radius:50%;border:2px solid var(--accent);background:transparent;color:var(--accent);display:grid;place-items:center;padding:0}
.ib svg{width:22px;height:22px}
#stage{flex:1;min-height:0;position:relative;background:var(--cur);color:var(--on-cur);display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;transition:background .2s}
#wm{position:absolute;left:50%;top:50%;width:min(80vw,62vh);height:min(80vw,62vh);transform:translate(-50%,-50%);object-fit:contain;opacity:.13;pointer-events:none}
#phase{font-size:min(14vw,10vh);line-height:1;position:relative;text-align:center;padding:0 8px}
#big{font-size:min(38vw,34vh);line-height:.9;position:relative}
#next{background:var(--nxt);color:var(--on-nxt);text-align:center;padding:10px 8px;line-height:1.05}
#next small{display:block;font-size:min(7vw,4.6vh)}
#next b{display:block;font-size:min(15vw,8.5vh);font-weight:400}
.ctrl{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;padding:12px 10px}
.stat{text-align:center;line-height:1}
.stat b{display:block;font-size:min(20vw,10vh);font-weight:400}
.stat small{font-size:min(4.2vw,2.6vh);color:#d8d8d8;display:block;margin-top:4px}
#sL b{color:var(--work)}#sR b{color:var(--prep)}
.playwrap{text-align:center;color:var(--cur)}
.play{width:min(27vw,13vh);height:min(27vw,13vh);min-width:84px;min-height:84px;border-radius:50%;border:0;background:var(--cur);color:var(--on-cur);display:grid;place-items:center;box-shadow:inset 0 0 0 5px var(--bg),inset 0 0 0 8px var(--on-cur);padding:0}
.play svg{width:42%;height:42%}
.play:disabled{opacity:.35}
#playLbl{display:block;margin-top:6px;font-size:min(6vw,3.6vh)}
nav{display:flex;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);background:var(--bg)}
nav button{flex:1;background:none;border:0;color:var(--mut);padding:8px 0 6px;font-size:14px;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button svg{width:30px;height:30px}
nav button.on{color:#fff}
/* sheet / dialog */
#sheet{position:fixed;inset:0;z-index:20;background:var(--bg);overflow:auto;padding-top:env(safe-area-inset-top)}
.sh-top{position:sticky;top:0;background:var(--bg);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:14px 14px;z-index:2;border-bottom:1px solid var(--line)}
.sh-top button{background:none;border:0;font-size:20px;padding:6px}
.sh-top .c{color:var(--mut);justify-self:start}.sh-top .g{color:#5fd16f;justify-self:end}
.sh-top h2{margin:0;font-weight:400;font-size:22px}
.sh-body{padding:8px 16px 40px;max-width:640px;margin:0 auto}
.fld{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.fld .l{font-size:24px}.fld .d{font-family:'Oswald',sans-serif;font-size:13px;color:var(--mut);letter-spacing:0;grid-column:1}
.stp{grid-column:2;grid-row:1/3;display:flex;align-items:center;gap:6px}
.stp button{width:40px;height:40px;border-radius:50%;border:2px solid #555;background:none;font-size:24px;line-height:1;padding:0;touch-action:manipulation}
.stp input{width:92px;text-align:center;background:#1d1d1d;border:1px solid #333;border-radius:8px;color:#fff;font:inherit;font-size:32px;padding:2px 0;-webkit-user-select:text;user-select:text}
.txt{width:100%;background:#1d1d1d;border:1px solid #333;border-radius:8px;color:#fff;font:inherit;font-size:22px;padding:10px 12px;-webkit-user-select:text;user-select:text}
.h3{font-size:20px;color:var(--mut);margin:26px 0 10px}
.btn{background:var(--prep);color:#141414;border:0;border-radius:10px;padding:12px 16px;font-size:20px}
.btn.o{background:none;color:#fff;border:2px solid #555}
.btn.w{width:100%}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;display:flex;gap:10px;align-items:center}
.card .in{flex:1;min-width:0}
.card h4{margin:0 0 4px;font-weight:400;font-size:22px}
.card p{margin:0;font-family:'Oswald',sans-serif;font-size:13px;color:#bbb;letter-spacing:0}
.card .x{background:none;border:0;color:#c66;font-size:22px}
#dlg{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.65);display:grid;place-items:center;padding:20px}
#dlg .bx{background:#222;width:min(420px,100%);border-radius:6px;overflow:hidden;text-align:center}
#dlg p{margin:0;padding:26px 18px;font-size:26px;line-height:1.1}
#dlg .bt{display:grid;grid-template-columns:1fr 1fr}
#dlg .bt button{border:0;background:#ddd;color:#111;font-size:20px;padding:18px}
#dlg .bt button+button{border-left:2px solid #222}
/* stopwatch */
#swstage{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--work);color:var(--on-cur);position:relative;overflow:hidden}
#swbig{font-size:min(26vw,24vh);line-height:.95;position:relative}
#swlaps{max-height:26vh;overflow:auto;width:min(420px,90%);margin-top:8px;font-family:'Oswald',sans-serif;font-size:16px;letter-spacing:0;position:relative}
#swlaps div{display:flex;justify-content:space-between;padding:3px 6px;border-bottom:1px solid rgba(255,255,255,.25)}
.swbtns{display:flex;gap:14px;justify-content:center;padding:14px}
.swbtns .btn{min-width:110px;font-size:24px;padding:14px}
/* more */
#v-more .sh-body{overflow:auto;flex:1;width:100%}
.tg{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);font-size:22px}
.tg input{width:26px;height:26px}
.cols{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.cp{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--card);border-radius:10px;padding:8px 12px;font-size:19px}
.cp input{width:44px;height:34px;border:0;background:none;padding:0}
.themes{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.th{display:flex;gap:3px;align-items:center;border:2px solid #444;border-radius:10px;padding:6px 8px;background:none;font-size:16px}
.th i{width:14px;height:14px;border-radius:50%;display:inline-block}
.lg{display:flex;align-items:center;gap:12px;margin:10px 0}
.lg img{width:64px;height:64px;border-radius:50%;object-fit:cover;background:#222}
input[type=range]{width:100%}

/* ---- paisagem (TV / celular espelhado) ---- */
@media (min-aspect-ratio:13/10){
 #v-timer.on{display:grid;grid-template-columns:minmax(0,1fr) min(36%,420px);grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"top top" "stage next" "stage ctrl"}
 #v-timer .top{grid-area:top;min-height:46px;padding:4px 12px}
 #v-timer .ib{width:36px;height:36px}
 .mid b{font-size:30px}
 #stage{grid-area:stage}
 #next{grid-area:next;display:flex;flex-direction:column;justify-content:center;padding:6px}
 .ctrl{grid-area:ctrl;grid-template-columns:1fr 1fr;padding:8px;align-content:center}
 .playwrap{grid-column:1/3;grid-row:1;display:flex;align-items:center;justify-content:center;gap:14px}
 .play{width:min(22vh,110px);height:min(22vh,110px);min-width:70px;min-height:70px}
 #playLbl{margin:0;font-size:min(8vh,30px)}
 #phase{font-size:min(9vw,15vh)}
 #big{font-size:min(30vw,52vh)}
 #next small{font-size:min(3.4vw,6vh)}#next b{font-size:min(7vw,14vh)}
 .stat b{font-size:min(9vw,16vh)}.stat small{font-size:min(2vw,3.6vh)}
 nav button{flex-direction:row;justify-content:center;gap:8px;padding:5px 0;font-size:13px}
 nav button svg{width:22px;height:22px}
 body.run nav{display:none}
 #swbig{font-size:min(20vw,40vh)}
}
.snd{padding:12px 0;border-bottom:1px solid var(--line)}
.sl{font-size:20px;margin-bottom:8px}
.sr{display:flex;gap:10px}
.sr select{flex:1;min-width:0;background:#1d1d1d;color:#fff;border:1px solid #333;border-radius:8px;font:inherit;font-size:20px;padding:10px}
.pv{width:52px;flex:none;border-radius:8px;border:0;background:var(--work);color:#fff;font-size:20px}

/* ---- tela cheia deitado (padrão das fotos) ---- */
#land{display:none}
@media (min-aspect-ratio:13/10){
 #v-timer.on{display:flex!important}
 #v-timer.on>:not(#land){display:none!important}
 #v-timer.on #land{display:flex}
 body.vt nav{display:none}
}
#land{position:relative;flex:1;min-height:0;flex-direction:column;background:var(--cur);color:var(--on-cur);transition:background .2s;
 padding:0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);overflow:hidden}
#lwm{position:absolute;left:50%;top:50%;height:96%;aspect-ratio:1;transform:translate(-50%,-50%);object-fit:contain;opacity:.13;pointer-events:none;z-index:0}
.lt,#lbig,.lbt{position:relative;z-index:1}
.lt{display:flex;align-items:center;gap:2.2vw;height:15vh;padding:1.6vh 1.6vw 0;white-space:nowrap}
.lb{flex:none;width:11vh;height:11vh;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;display:grid;place-items:center;padding:0}
.lb svg{width:52%;height:52%}
.llogo{flex:none;width:11vh;height:11vh;border-radius:50%;box-shadow:0 .3vh 1.2vh rgba(0,0,0,.35)}
.ltt{font-size:8.5vh;opacity:.8}
.lph{font-size:12.5vh;flex:1;overflow:hidden;text-overflow:ellipsis}
#lbig{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
#lbig{position:relative}
#lTime{position:absolute;left:0;top:0;opacity:0;pointer-events:none;font-size:20px;line-height:1;letter-spacing:0;white-space:nowrap}
#lCv{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
.lbt{display:flex;align-items:stretch;height:14vh;font-size:9.5vh;white-space:nowrap}
.lbt>span{display:flex;align-items:center}
.lbt .bx{background:#0d0d0d;color:var(--work);padding:0 2.4vw;font-size:12vh;border-top-right-radius:1.2vh}
.lbt .bx2{color:#fff;border-radius:0;border-top-left-radius:1.2vh}
.lbt .as{padding:0 1.8vw}
.lbt .pill{background:var(--nxt);color:var(--on-nxt);padding:0 1.8vw}
.lbt .sp{flex:1}
</style>
</head>
<body>
<div id="app">
  <!-- TIMER -->
  <section class="view on" id="v-timer">
    <div class="top">
      <div class="brand"><img class="blogo" alt=""><span class="bname"></span></div>
      <div class="mid"><small id="title">TABATA</small><b id="total">00:00</b></div>
      <div class="icons">
        <button class="ib" id="bGear" aria-label="Configurar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M18.7 5.3l-2.1 2.1M7.4 16.6l-2.1 2.1"/></svg></button>
        <button class="ib" id="bReset" aria-label="Reiniciar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v5h-5"/></svg></button>
      </div>
    </div>
    <div id="stage"><img id="wm" alt=""><div id="phase">PREPARAR</div><div id="big">00:00</div></div>
    <div id="next"><small id="nxL">EXERCÍCIO:</small><b id="nxT">03:00</b></div>
    <div class="ctrl">
      <div class="stat" id="sL"><b>6</b><small>RONDAS RESTANTES</small></div>
      <div class="playwrap"><button class="play" id="bPlay" aria-label="Iniciar"></button><span id="playLbl">INICIAR</span></div>
      <div class="stat" id="sR"><b>1</b><small>CICLOS RESTANTES</small></div>
    </div>
    <div id="land"><img id="lwm" alt="">
      <div class="lt">
        <button class="lb" id="lReset" aria-label="Reiniciar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v5h-5"/></svg></button>
        <img class="llogo" id="lLogo" alt="">
        <span class="ltt" id="lTot">TABATA 00:00</span>
        <span class="lph" id="lPh">PREPARAR</span>
        <button class="lb" id="lFs" aria-label="Tela cheia" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
        <button class="lb" id="lPlay" aria-label="Iniciar ou pausar"></button>
      </div>
      <div id="lbig"><span id="lTime">00:00</span><canvas id="lCv" aria-hidden="true"></canvas></div>
      <div class="lbt">
        <span class="bx" id="lRd">6</span>
        <span class="as" id="lAs">A SEGUIR</span>
        <span class="pill" id="lNx">EXERCÍCIO: 03:00</span>
        <span class="sp"></span>
        <span class="bx bx2" id="lCy">1</span>
      </div>
    </div>
  </section>
  <!-- STOPWATCH -->
  <section class="view" id="v-sw">
    <div class="top"><div class="brand"><img class="blogo" alt=""><span class="bname"></span></div><div class="mid"><small>CRONÔMETRO</small></div><div class="icons"></div></div>
    <div id="swstage"><img class="wm2" id="wm2" alt="" style="position:absolute;left:50%;top:50%;width:min(80vw,62vh);height:min(80vw,62vh);transform:translate(-50%,-50%);object-fit:contain;opacity:.1;pointer-events:none"><div id="swbig">00:00.0</div><div id="swlaps"></div></div>
    <div class="swbtns"><button class="btn o" id="swLap">VOLTA</button><button class="btn" id="swGo">INICIAR</button><button class="btn o" id="swReset">ZERAR</button></div>
  </section>
  <!-- MORE -->
  <section class="view" id="v-more">
    <div class="top"><div class="brand"><img class="blogo" alt=""><span class="bname"></span></div><div class="mid"><small>MAIS</small></div><div class="icons"></div></div>
    <div class="sh-body" id="moreBody"></div>
  </section>
  <nav id="nav">
    <button data-n="tabata"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2"><circle cx="16" cy="17" r="10"/><path d="M13 3h6M17 11l-3 7h4l-3 6"/></svg>TABATA</button>
    <button data-n="rounds"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2"><circle cx="16" cy="16" r="11"/><path d="M16 16 9 9"/></svg>ROUNDS</button>
    <button data-n="sw"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2"><circle cx="16" cy="16" r="11"/><circle cx="16" cy="16" r="1.5"/></svg>CRONÔMETRO</button>
    <button data-n="more"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 5a11 11 0 1 1-11 11"/></svg>MAIS</button>
  </nav>
</div>
<div id="sheet" hidden></div>
<div id="dlg" hidden></div>

<script>
(()=>{
'use strict';

let acStale=false;
/* Música junto: modo "ambient" toca os bipes por cima do Deezer/Spotify/YouTube sem pausar a música.

const lockMode=()=>!!S.sound.lock;

 o.connect(g);g.connect(out());o.start(t);o.stop(t+d+.02)}catch(e){}}
function out(){if(!comp){comp=ac.createDynamicsCompressor();comp.threshold.value=-10;comp.ratio.value=4;comp.connect(ac.destination)}return comp}
/* ---- biblioteca de sons ---- */
function osc(type,f,t,d,v,dest){const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.01);g.gain.setValueAtTime(v,t+d-.05);g.gain.linearRampToValueAtTime(0,t+d);o.connect(g);g.connect(dest||out());o.start(t);o.stop(t+d+.02);return o}
function strike(t,f,len,v){[[1,1],[2.4,.5],[3.9,.3],[5.4,.18]].forEach(([m,a])=>{const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=f*m;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v*a,t+.005);g.gain.exponentialRampToValueAtTime(.0008,t+len);o.connect(g);g.connect(out());o.start(t);o.stop(t+len+.05)})}
function lp(f){const x=ac.createBiquadFilter();x.type='lowpass';x.frequency.value=f;x.connect(out());return x}
const SOUNDS={

 bipC:{n:'Bipe 3 — grave (1,2 s)',p:(t,v)=>osc('square',500,t,1.2,Math.min(1,v*.9))},
 bipD:{n:'Bipe 4 — buzzer digital (1,2 s)',p:(t,v)=>{const f=lp(4000);osc('sawtooth',1000,t,1.2,Math.min(1,v*.5),f)}},
 bipE:{n:'Bipe 5 — pulsado (1,2 s)',p:(t,v)=>{for(let k=0;k<6;k++)osc('square',1000,t+k*.2,.12,Math.min(1,v*.75))}},

 bipG:{n:'Bipe 7 — suave duplo (1,2 s)',p:(t,v)=>{[0,.62].forEach(s=>{const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=880;g.gain.setValueAtTime(0,t+s);g.gain.linearRampToValueAtTime(v*.8,t+s+.02);g.gain.setValueAtTime(v*.8,t+s+.4);g.gain.linearRampToValueAtTime(0,t+s+.55);o.connect(g);g.connect(out());o.start(t+s);o.stop(t+s+.6)})}},
 bipH:{n:'Bipe 8 — suave descendente (1,2 s)',p:(t,v)=>{const o=ac.createOscillator(),g=ac.createGain();o.type='triangle';o.frequency.setValueAtTime(1200,t);o.frequency.exponentialRampToValueAtTime(600,t+1.2);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v*.85,t+.03);g.gain.setValueAtTime(v*.85,t+.9);g.gain.linearRampToValueAtTime(0,t+1.2);o.connect(g);g.connect(out());o.start(t);o.stop(t+1.25)}},

 apito:{n:'Apito de árbitro',p:(t,v)=>{[[0,.32],[.42,.9]].forEach(([s,d])=>{const o=osc('sine',2900,t+s,d,v*.55),l=ac.createOscillator(),lg=ac.createGain();l.frequency.value=28;lg.gain.value=180;l.connect(lg);lg.connect(o.frequency);l.start(t+s);l.stop(t+s+d)})}},
 bipe:{n:'Bipe eletrônico',p:(t,v)=>{[0,.3,.6].forEach((s,i)=>osc('square',i<2?1000:1500,t+s,i<2?.18:.5,v*.4))}},
 gongo:{n:'Gongo',p:(t,v)=>{[[110,1],[164,.6],[231,.45],[297,.3]].forEach(([f,a])=>{const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v*a,t+.02);g.gain.exponentialRampToValueAtTime(.0008,t+3.5);o.connect(g);g.connect(out());o.start(t);o.stop(t+3.6)})}},

 final:{n:'Buzina + sino',p:(t,v)=>{SOUNDS.buzina.p(t,v);SOUNDS.sino3.p(t+1.3,v)}},
 nenhum:{n:'Sem som',p:()=>{}}
};

/* ---- faixa de áudio do treino (toca mesmo com a tela bloqueada) ----
   Ao dar play, o app gera um arquivo de áudio com todos os bipes e sinos do restante do treino, nos tempos certos,
   e toca esse arquivo como uma música. Com a tela bloqueada o iPhone congela o app, mas continua tocando o áudio. */
const BG_SR=16000,BG_CH=30;let bgA=null,bgUrl=null,bgGen=0,bgOn=false,bgFrom=0,bgCovered=Infinity;
const live=at=>!(bgOn&&at>=bgCovered);
function wavHead(n){const b=new ArrayBuffer(44),v=new DataView(b),w=(o,t)=>{for(let i=0;i<t.length;i++)v.setUint8(o+i,t.charCodeAt(i))};
 w(0,'RIFF');v.setUint32(4,36+n,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
 v.setUint32(24,BG_SR,true);v.setUint32(28,BG_SR,true);v.setUint16(32,1,true);v.setUint16(34,8,true);w(36,'data');v.setUint32(40,n,true);return b}
const SILENT=URL.createObjectURL(new Blob([wavHead(1600),new Uint8Array(1600).fill(128)],{type:'audio/wav'}));
function bgEl(){if(!bgA){bgA=new Audio();bgA.preload='auto';bgA.setAttribute('playsinline','');bgA.addEventListener('error',()=>{bgOn=false})}return bgA}
function cueList(from){const L=[],cd=S.sound.countdown;
 segs.forEach((g,i)=>{if(i>0)L.push({t:g.s,k:g.type==='prep'?'prep':g.type==='work'?'work':'rest'});
  if(cd)for(let r=3;r>=1;r--){const t=g.e-r*1000;if(t>g.s)L.push({t,k:'tick'})}});
 L.push({t:total,k:'done'});return L.filter(c=>c.t>from)}
function bgSched(k,at){if(k==='tick')tone(880,.12,at);else if(k==='prep')tone(990,.3,at);
 else{const id=k==='work'?S.sound.start:k==='rest'?S.sound.end:S.sound.finish;(SOUNDS[id]||SOUNDS.sino3).p(at,S.sound.vol)}}
async function bgRender(from,gen){const OAC=window.OfflineAudioContext||window.webkitOfflineAudioContext;if(!OAC)return null;
 const L=cueList(from),dur=(total-from)/1000+5,N=Math.ceil(dur*BG_SR),pcm=new Uint8Array(N).fill(128),PRE=6;
 for(let a=0;a<dur;a+=BG_CH){if(gen!==bgGen)return null;const b=Math.min(dur,a+BG_CH);
  const cs=L.filter(c=>{const t=(c.t-from)/1000;return t>=a-PRE&&t<b});if(!cs.length)continue;
  const len=Math.ceil((b-a+PRE)*BG_SR),off=new OAC(1,len,BG_SR),sa=ac,sc=comp;
  try{ac=off;comp=null;cs.forEach(c=>bgSched(c.k,(c.t-from)/1000-(a-PRE)))}finally{ac=sa;comp=sc}
  const buf=await new Promise((r,j)=>{off.oncomplete=e=>r(e.renderedBuffer);try{const p=off.startRendering();if(p&&p.then)p.then(r,j)}catch(e){j(e)}});
  const d=buf.getChannelData(0),s0=Math.round(PRE*BG_SR),i0=Math.round(a*BG_SR);
  for(let j=s0;j<d.length&&i0+j-s0<N;j++){const x=d[j];if(x){const p=i0+j-s0,y=pcm[p]-128+x*127;pcm[p]=Math.max(0,Math.min(255,Math.round(y+128)))}}}
 return URL.createObjectURL(new Blob([wavHead(N),pcm],{type:'audio/wav'}))}
function bgStart(){if(!S.sound.on||!segs.length||!lockMode())return;const gen=++bgGen,a=bgEl();bgOn=false;bgCovered=Infinity;
 try{a.src=SILENT;a.loop=true;const p=a.play();p&&p.catch(()=>{})}catch(e){}   /* destrava o player dentro do toque no play */
 const from=elapsed();bgFrom=from;
 setTimeout(async()=>{let url=null;try{url=await bgRender(from,gen)}catch(e){url=null}
  if(gen!==bgGen||!running||!url){if(url)URL.revokeObjectURL(url);return}
  if(bgUrl)URL.revokeObjectURL(bgUrl);bgUrl=url;a.loop=false;a.src=url;
  const go=()=>{if(gen!==bgGen||!running)return;const now=elapsed();bgCovered=now+400;a.currentTime=Math.max(0,(now-from)/1000);
   const p=a.play();bgOn=true;p&&p.catch(()=>{bgOn=false})};
  if(a.readyState>=1)go();else a.addEventListener('loadedmetadata',go,{once:true});
  try{if('mediaSession'in navigator){navigator.mediaSession.metadata=new MediaMetadata({title:'Cronômetro',artist:S.brand.name});
   navigator.mediaSession.setActionHandler('pause',()=>{if(running)pause()});navigator.mediaSession.setActionHandler('play',()=>{if(!running)start()})}}catch(e){}},30)}
function bgStop(){bgGen++;bgOn=false;bgCovered=Infinity;try{bgA&&bgA.pause()}catch(e){}}
/* ao voltar para o app, acerta a faixa com o relógio se ela tiver escorregado */
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&running&&bgOn&&bgA){
 const want=(elapsed()-bgFrom)/1000;if(Math.abs(bgA.currentTime-want)>.35)try{bgA.currentTime=want}catch(e){}
 if(bgA.paused){const p=bgA.play();p&&p.catch(()=>{bgOn=false})}}});
/* ---------- engine ---------- */
let mode='tabata',view='timer',segs=[],total=0,el=0,t0=0,running=false,finished=false,idx0=-1,lastKey='',iv=null;
const LBL={tabata:{prep:'PREPARAR',work:'EXERCÍCIO',rest:'DESCANSAR',cycleRest:'DESCANSO ENTRE CICLOS'},
 rounds:{prep:'PREPARAR',work:'LUTA',rest:'DESCANSO',cycleRest:'DESCANSO'},countdown:{prep:'PREPARAR',work:'TEMPO',rest:'DESCANSO',cycleRest:'DESCANSO'}};
const TITLE={tabata:'TABATA',rounds:'ROUNDS',countdown:'CONTAGEM'};
const colorOf=t=>({prep:S.brand.colors.prep,work:S.brand.colors.work,rest:S.brand.colors.rest,cycleRest:S.brand.colors.rest,done:S.brand.colors.done})[t];
function build(){const c=S[mode];segs=[];let t=0;
 const add=(type,d,r,cy)=>{if(d>0){segs.push({type,d,r,c:cy,s:t*1000,e:(t+d)*1000});t+=d}};
 if(mode==='countdown')add('work',c.work,1,1);
 else{add('prep',c.prep,1,1);
  for(let cy=1;cy<=c.cycles;cy++)for(let r=1;r<=c.rounds;r++){add('work',c.work,r,cy);
   if(!(cy===c.cycles&&r===c.rounds)){if(r<c.rounds)add('rest',c.rest,r,cy);else add('cycleRest',c.cycleRest>0?c.cycleRest:c.rest,r,cy)}}}
 total=t*1000}
const elapsed=()=>running?Math.min(total,el+Date.now()-t0):el;
const curIdx=e=>{for(let i=0;i<segs.length;i++)if(e<segs[i].e)return i;return Math.max(0,segs.length-1)};
function cue(type,at){if(live(at)){if(type==='prep')snd.prep();else if(type==='work')snd.work();else snd.rest()}vib(type==='work'?[300]:[120,80,120])}
function start(){if(!segs.length)return;ensureAudio();if(finished)reset();running=true;t0=Date.now();bgStart();
 idx0=curIdx(el);if(el===0)cue(segs[idx0].type,-1);lastKey='';wake();clearInterval(iv);iv=setInterval(tick,100);render()}
function pause(){el=elapsed();running=false;bgStop();clearInterval(iv);release();render()}
function reset(){running=false;finished=false;el=0;idx0=-1;lastKey='';bgStop();clearInterval(iv);release();build();render()}
function tick(){const e=elapsed();
 if(e>=total){running=false;finished=true;el=total;clearInterval(iv);release();if(live(total))snd.done();bgOn=false;bgGen++;vib([400,150,400]);render();return}
 const i=curIdx(e),rem=Math.ceil((segs[i].e-e)/1000);
 if(i!==idx0){idx0=i;cue(segs[i].type,segs[i].s);lastKey=i+'-'+rem}
 else if(S.sound.countdown&&rem<=3&&rem>=1&&i+'-'+rem!==lastKey){lastKey=i+'-'+rem;if(live(segs[i].e-rem*1000))snd.tick()}
 render()}

/* número grande desenhado num canvas: mede os pixels reais dos dígitos (igual em iPhone, Android e TV)
   e centraliza com folga em cima e embaixo */
const BIG_W=.94,BIG_H=.80;
function inkOf(txt,fam){const k=txt+'|'+fam+'|'+(document.fonts?document.fonts.status:'');const C=inkOf.m||(inkOf.m={});if(C[k])return C[k];
 const S=200,cv=inkOf.cv||(inkOf.cv=document.createElement('canvas')),c=cv.getContext('2d',{willReadFrequently:true});
 c.font=S+'px '+fam;const w=Math.ceil(c.measureText(txt).width)+S,h=S*2;cv.width=w;cv.height=h;
 c.font=S+'px '+fam;c.textBaseline='alphabetic';c.textAlign='left';c.fillStyle='#000';c.clearRect(0,0,w,h);c.fillText(txt,S/2,S*1.4);
 const d=c.getImageData(0,0,w,h).data;let x0=w,x1=-1,y0=h,y1=-1;
 for(let y=0;y<h;y++){const r=y*w*4;for(let x=0;x<w;x++)if(d[r+x*4+3]>40){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y}}
 if(x1<0)return null;const o={S,w:(x1-x0+1)/S,h:(y1-y0+1)/S,l:(x0-S/2)/S,t:(y0-S*1.4)/S};C[k]=o;return o}
function fitBig(){const box=$('#lbig'),el=$('#lTime'),cv=$('#lCv');if(!box||!cv)return;
 const W=box.clientWidth,H=box.clientHeight;if(!W||!H)return;
 const dpr=Math.min(window.devicePixelRatio||1,3),pw=Math.round(W*dpr),ph=Math.round(H*dpr);
 if(cv.width!==pw||cv.height!==ph){cv.width=pw;cv.height=ph}
 const c=cv.getContext('2d');c.setTransform(1,0,0,1,0,0);c.clearRect(0,0,pw,ph);
 const txt=el.textContent,cs=getComputedStyle(el),fam=cs.fontFamily;
 const ink=inkOf(txt.replace(/\d/g,'8'),fam);if(!ink)return;
 const f=Math.min(W*BIG_W/ink.w,H*BIG_H/ink.h);           /* tamanho da fonte em px CSS */
 const x=(W-ink.w*f)/2-ink.l*f, y=(H-ink.h*f)/2-ink.t*f;   /* posição da linha de base para centralizar o desenho */
 c.setTransform(dpr,0,0,dpr,0,0);c.font=f+'px '+fam;c.textBaseline='alphabetic';c.textAlign='left';c.fillStyle=cs.color;c.fillText(txt,x,y)}

const FIELDS={
 tabata:[['prep','PREPARAR','Contagem decrescente antes de começar','t'],['work','EXERCÍCIO','Fazer exercícios durante este tempo','t'],['rest','DESCANSAR','Descansar durante este tempo','t'],
  ['rounds','RONDAS','Uma ronda é trabalho + descanso','n'],['cycles','CICLOS','','n'],['cycleRest','DESCANSO ENTRE CICLOS','Intervalo de recuperação (0 = usa o descanso normal)','t']],
 rounds:[['prep','PREPARAR','Contagem decrescente antes do primeiro round','t'],['work','LUTA','Duração de cada round','t'],['rest','DESCANSO','Intervalo entre os rounds','t'],['rounds','ROUNDS','Quantidade de rounds','n']],
 countdown:[['work','TEMPO','Contagem regressiva simples','t']]};
function parseT(s){s=String(s).trim();if(s.includes(':')){const[a,b]=s.split(':');return(parseInt(a)||0)*60+(parseInt(b)||0)}return parseInt(s)||0}
function openEditor(){
 const m=mode,d={...S[m]};let pname='';const sh=$('#sheet');
 const paint=()=>{sh.innerHTML='';const refs=[];
  const lim=(k,t)=>({lo:(k==='work'||k==='rounds'||k==='cycles')?(k==='work'?1:1):0,hi:t==='t'?5999:99});
  const rows=FIELDS[m].map(([k,label,desc,t])=>{
   const inp=h('input',{type:'text',inputmode:'numeric','aria-label':label});
   const dd=h('div',{class:'d'},desc);
   const upd=()=>{inp.value=t==='t'?fmt(d[k]):d[k];if(k==='cycles')dd.textContent='Um ciclo são '+d.rounds+' rondas';};
   const set=v=>{const{lo,hi}=lim(k,t);d[k]=Math.min(hi,Math.max(lo,v));refs.forEach(f=>f())};
   const step=dir=>{const v=d[k];if(t==='n')set(v+dir);else{const st=dir>0?(v>=60?15:5):(v>60?15:5);set(v+dir*st)}};
   const hold=(dir)=>{let to,ii;const stop=()=>{clearTimeout(to);clearInterval(ii)};
    return{onpointerdown:ev=>{ev.preventDefault();step(dir);to=setTimeout(()=>{ii=setInterval(()=>step(dir),90)},420)},onpointerup:stop,onpointerleave:stop,onpointercancel:stop}};
   inp.addEventListener('change',()=>set(t==='t'?parseT(inp.value):(parseInt(inp.value)||1)));
   inp.addEventListener('focus',()=>inp.select());
   refs.push(upd);upd();
   const mk=(txt,dir)=>{const b=h('button',{type:'button','aria-label':dir>0?'Aumentar':'Diminuir'},txt);const hd=hold(dir);for(const ev in hd)b.addEventListener(ev.slice(2),hd[ev]);return b};
   return h('div',{class:'fld'},h('div',{class:'l'},label),dd,h('div',{class:'stp'},mk('−',-1),inp,mk('+',1)))});
  const mine=S.presets.filter(p=>p.mode===m);
  sh.append(
   h('div',{class:'sh-top'},h('button',{class:'c',onclick:()=>{sh.hidden=true}},'CANCELAR'),h('h2',{},m==='countdown'?'CONTAGEM REGRESSIVA':TITLE[m]),
    h('button',{class:'g',onclick:()=>{S[m]=d;save();sh.hidden=true;reset()}},'GUARDAR')),
   h('div',{class:'sh-body'},rows,
    m==='countdown'?null:[h('div',{class:'h3'},'SALVAR ESTE TREINO'),
     h('input',{class:'txt',placeholder:'Nome do treino (opcional)',value:pname,oninput:e=>{pname=e.target.value}}),
     h('div',{style:'height:10px'}),
     h('button',{class:'btn w',onclick:()=>{const nm=(pname.trim()||(fmt(d.work)+' x '+d.rounds));S.presets.push({...d,id:'p'+Date.now(),name:nm,mode:m});save();pname='';paint()}},'SALVAR COMO TREINO'),
     h('div',{class:'h3'},'MEUS TREINOS ('+mine.length+')'),
     mine.map(p=>h('div',{class:'card'},
      h('div',{class:'in',onclick:()=>{FIELDS[m].forEach(([k])=>{d[k]=p[k]});if(m==='tabata'){d.cycles=p.cycles;d.cycleRest=p.cycleRest}paint();sh.scrollTo&&sh.scrollTo(0,0)}},
       h('h4',{},p.name),h('p',{},(m==='tabata'?'Preparar '+fmt(p.prep)+' · Exercício '+fmt(p.work)+' · Descanso '+fmt(p.rest)+' · '+p.rounds+' rondas'+(p.cycles>1?' · '+p.cycles+' ciclos':''):'Preparar '+fmt(p.prep)+' · Luta '+fmt(p.work)+' · Descanso '+fmt(p.rest)+' · '+p.rounds+' rounds'))),
      h('button',{class:'x','aria-label':'Apagar',onclick:()=>confirmDlg('Apagar o treino "'+p.name+'"?','APAGAR',()=>{S.presets=S.presets.filter(x=>x.id!==p.id);save();paint()})},'✕')))]));};
 paint();sh.hidden=false;sh.scrollTop=0}

/* ---------- stopwatch ---------- */
const sw={run:false,el:0,t0:0,laps:[],iv:null};
const swNow=()=>sw.run?sw.el+performance.now()-sw.t0:sw.el;
const fmtSw=ms=>{const t=Math.floor(ms/100);return pad(Math.floor(t/600))+':'+pad(Math.floor(t/10)%60)+'.'+(t%10)};
function swRender(){$('#swbig').textContent=fmtSw(swNow());$('#swGo').textContent=sw.run?'PAUSAR':(sw.el>0?'RETOMAR':'INICIAR');
 const box=$('#swlaps');box.innerHTML='';sw.laps.slice().reverse().forEach(l=>box.append(h('div',{},h('span',{},'VOLTA '+l.n),h('span',{},fmtSw(l.split)),h('span',{},fmtSw(l.total)))))}
$('#swGo').addEventListener('click',()=>{ensureAudio();if(sw.run){sw.el=swNow();sw.run=false;clearInterval(sw.iv);release()}else{sw.t0=performance.now();sw.run=true;sw.iv=setInterval(()=>{$('#swbig').textContent=fmtSw(swNow())},50);wake()}swRender()});
$('#swLap').addEventListener('click',()=>{if(!sw.run)return;const t=swNow(),last=sw.laps.length?sw.laps[sw.laps.length-1].total:0;sw.laps.push({n:sw.laps.length+1,split:t-last,total:t});swRender()});
$('#swReset').addEventListener('click',()=>{sw.run=false;sw.el=0;sw.laps=[];clearInterval(sw.iv);release();swRender()});

/* ---------- more ---------- */
function renderMore(){const b=$('#moreBody');b.innerHTML='';const C=S.brand.colors;
 const tg=(label,key)=>h('label',{class:'tg'},h('span',{},label),h('input',{type:'checkbox',...(S.sound[key]?{checked:''}:{}),onchange:e=>{S.sound[key]=e.target.checked;save()}}));
 const cp=(label,k)=>h('label',{class:'cp'},label,h('input',{type:'color',value:C[k],oninput:e=>{C[k]=e.target.value;applyTheme();save();render()}}));
 const file=h('input',{type:'file',accept:'image/*',hidden:'',onchange:e=>{const f=e.target.files&&e.target.files[0];if(f)handleLogo(f)}});
 b.append(
  h('div',{class:'h3'},'FERRAMENTAS'),
  h('div',{class:'cols'},h('button',{class:'btn',onclick:()=>go('more','countdown')},'CONTAGEM REGRESSIVA'),h('button',{class:'btn o',onclick:()=>{try{const r=document.documentElement.requestFullscreen?document.documentElement.requestFullscreen():null;r&&r.catch&&r.catch(()=>{})}catch(e){}}},'TELA CHEIA')),
  h('div',{class:'h3'},'PERSONALIZAÇÃO'),
  h('input',{class:'txt',value:S.brand.name,maxlength:'28',placeholder:'Nome da academia',oninput:e=>{S.brand.name=e.target.value.toUpperCase();save();refreshBrand()}}),
  h('div',{class:'lg'},h('img',{class:'blogo',alt:'logo',src:logoSrc()}),h('button',{class:'btn',onclick:()=>file.click()},'TROCAR LOGO'),
   S.brand.logo?h('button',{class:'btn o',onclick:()=>{S.brand.logo='';save();refreshBrand();renderMore()}},'USAR LOGO SHARK'):null,file),
  h('div',{class:'h3'},'TEMAS DE CORES'),
  h('div',{class:'themes'},Object.keys(THEMES).map(n=>h('button',{class:'th',onclick:()=>{S.brand.colors={...THEMES[n]};applyTheme();save();render();renderMore()}},
   ['prep','work','rest'].map(k=>h('i',{style:'background:'+THEMES[n][k]})),n))),
  h('div',{class:'cols'},cp('PREPARAR','prep'),cp('EXERCÍCIO / LUTA','work'),cp('DESCANSO','rest'),cp('FIM','done'),cp('FUNDO','bg')),
  h('div',{class:'h3'},'SONS DO TREINO'),
  ...[['start','Início do round / exercício'],['end','Fim do round / descanso'],['finish','Fim do treino']].map(([k,l])=>h('div',{class:'snd'},
   h('div',{class:'sl'},l),
   h('div',{class:'sr'},h('select',{'aria-label':l,onchange:e=>{S.sound[k]=e.target.value;save();preview(e.target.value)}},
     Object.keys(SOUNDS).map(id=>h('option',{value:id,...(S.sound[k]===id?{selected:''}:{})},SOUNDS[id].n))),
    h('button',{class:'pv','aria-label':'Ouvir',onclick:()=>preview(S.sound[k])},'▶')))),
  h('div',{class:'h3'},'SOM E ALERTAS'),
  tg('Som ligado','on'),tg('Bipes nos últimos 3 segundos de cada fase','countdown'),tg('Vibração (celular)','vibrate'),
  h('label',{class:'tg'},h('span',{},'Tocar sons com a tela bloqueada',h('small',{style:'display:block;opacity:.65;font-size:.8em;margin-top:3px;line-height:1.3'},'Ligado: os bipes tocam mesmo com o celular bloqueado, mas pausa a música do Deezer/Spotify/YouTube. Desligado: os bipes tocam junto com a música (deixe a tela ligada e o celular fora do modo silencioso).')),
   h('input',{type:'checkbox',style:'flex:none;margin-left:12px',...(S.sound.lock?{checked:''}:{}),onchange:e=>{S.sound.lock=e.target.checked;save();if(!S.sound.lock)bgStop();applySession();acStale=true}})),
  h('label',{class:'tg'},h('span',{},'Volume'),h('input',{type:'range',min:'0.1',max:'1',step:'0.05',value:S.sound.vol,style:'width:55%',oninput:e=>{S.sound.vol=+e.target.value;save()}})),
  h('div',{style:'height:10px'}),
  h('button',{class:'btn o w',onclick:()=>{ensureAudio();snd.tick();preview(S.sound.start);setTimeout(()=>preview(S.sound.end),2600);setTimeout(()=>preview(S.sound.finish),4600)}},'TESTAR SONS'),
  h('div',{class:'h3'},'AVANÇADO'),
  h('button',{class:'btn o w',onclick:()=>confirmDlg('Restaurar todas as configurações e treinos de fábrica?','RESTAURAR',()=>{try{localStorage.removeItem(LS)}catch(e){}S=load();applyTheme();refreshBrand();reset();renderMore()})},'RESTAURAR PADRÕES'),
  h('div',{style:'height:30px'}))}
function handleLogo(f){try{const fr=new FileReader();fr.onload=()=>{const img=new Image();img.onload=()=>{try{const M=320,sc=Math.min(1,M/Math.max(img.width,img.height)),cv=document.createElement('canvas');
 cv.width=Math.max(1,Math.round(img.width*sc));cv.height=Math.max(1,Math.round(img.height*sc));cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
 S.brand.logo=cv.toDataURL('image/png');save();refreshBrand();renderMore()}catch(e){}};img.src=fr.result};fr.readAsDataURL(f)}catch(e){}}

/* ---------- wiring ---------- */
$('#bPlay').addEventListener('click',()=>{if(running)pause();else start()});
$('#bGear').addEventListener('click',openEditor);
(()=>{const d=document,el=d.documentElement,can=d.fullscreenEnabled||d.webkitFullscreenEnabled;if(can)$('#lFs').hidden=false;
 $('#lFs').addEventListener('click',()=>{try{const on=d.fullscreenElement||d.webkitFullscreenElement;const r=on?(d.exitFullscreen||d.webkitExitFullscreen).call(d):(el.requestFullscreen||el.webkitRequestFullscreen).call(el);r&&r.catch&&r.catch(()=>{})}catch(e){}})})();
$('#lPlay').addEventListener('click',()=>{if(running)pause();else start()});
$('#lReset').addEventListener('click',()=>confirmDlg('Deseja reiniciar o temporizador?','SIM',reset));
$('#bReset').addEventListener('click',()=>confirmDlg('Deseja reiniciar o temporizador?','SIM',reset));
document.addEventListener('keydown',e=>{if(e.code==='Space'&&view==='timer'&&$('#sheet').hidden&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName)){e.preventDefault();running?pause():start()}});
window.__app={get S(){return S},start,pause,reset,go,get state(){return{running,finished,el,total,segs,mode}},setCfg:(m,c)=>{S[m]={...S[m],...c};if(mode===m)reset()},tick,snd};
document.body.classList.add('vt');applyTheme();refreshBrand();build();render();swRender();paintNav();
})();
</script>
<script>
if('serviceWorker' in navigator&&location.protocol!=='file:'){addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
</script>
